<header>
  <strong data-i18n="app.title">Arabic Edu</strong>
  <div class="hdr-actions">
    <button id="theme-btn" type="button"
            aria-label="Toggle theme"
            data-i18n-attr="aria-label:nav.theme">☾</button>
    <select id="lang-sel" aria-label="Language"
            data-i18n-attr="aria-label:nav.lang">
      <option value="ar">العربية</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <button id="install-btn" type="button" hidden
            data-i18n="nav.install">Install</button>
    <button id="user-chip" type="button"
            data-i18n="nav.signin">Sign in</button>
  </div>
</header>
