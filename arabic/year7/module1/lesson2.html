<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lesson 2 — Practice · Arabic Edu</title>
  <meta name="theme-color" content="#0a7d5a">
  <link rel="icon" href="/arabic/assets/icons/icon-96x96.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="/arabic/assets/icons/icon-192x192.png">
  <link rel="stylesheet" href="/arabic/assets/css/styles.css">
  <link rel="stylesheet" href="/arabic/year7/module1/styles.css">
  <script>
    try {
      const m = JSON.parse(localStorage.getItem('edu:mode') || '"light"');
      const l = JSON.parse(localStorage.getItem('edu:lang') || '"ar"');
      document.documentElement.dataset.mode = m;
      document.documentElement.lang = l;
      document.documentElement.dir  = l === 'ar' ? 'rtl' : 'ltr';
    } catch {}
  </script>
  <script>
    window.I18N = {
      // app header partial
      'app.title':    { en: 'Arabic Edu',   fr: 'Éduc. Arabe',            ar: 'تعليم العربية' },
      'nav.signin':   { en: 'Sign in',      fr: 'Connexion',              ar: 'تسجيل الدخول' },
      'nav.install':  { en: 'Install',      fr: 'Installer',              ar: 'تثبيت' },
      'nav.addHome':  { en: 'Add to Home',  fr: 'Ajouter à l\u2019accueil', ar: 'أضف للشاشة' },
      'nav.lang':     { en: 'Language',     fr: 'Langue',                 ar: 'اللغة' },
      'nav.theme':    { en: 'Toggle theme', fr: 'Changer de thème',       ar: 'تبديل المظهر' },
      // app footer partial
      'footer.copy':   { en: 'Arabic Edu',      fr: 'Éduc. Arabe',           ar: 'تعليم العربية' },
      'footer.rights': { en: 'All rights reserved', fr: 'Tous droits réservés', ar: 'كل الحقوق محفوظة' },
      // module header partial
      'mod.nav':      { en: 'Module navigation', fr: 'Navigation du module', ar: 'تنقل الوحدة' },
      'mod.back':     { en: 'Back to Arabic Edu', fr: 'Retour à Éduc. Arabe', ar: 'العودة إلى تعليم العربية' },
      'mod.title':    { en: 'Year 7 · Module 1', fr: 'Année 7 · Module 1',   ar: 'السنة 7 · الوحدة 1' },
      // module footer partial
      'mod.copy':     { en: 'Year 7 · Module 1', fr: 'Année 7 · Module 1',   ar: 'السنة 7 · الوحدة 1' },
      'mod.lesson1':  { en: 'Lesson 1',          fr: 'Leçon 1',              ar: 'الدرس 1' },
      'mod.lesson2':  { en: 'Lesson 2',          fr: 'Leçon 2',              ar: 'الدرس 2' },
      // page
      'page.title':      { en: 'Lesson 2 — Practice',
                            fr: 'Leçon 2 — Exercices',
                            ar: 'الدرس الثاني — تمارين' },
      'page.intro':      { en: 'Answer both questions, then check.',
                            fr: 'Répondez aux deux questions, puis vérifiez.',
                            ar: 'أجب عن السؤالين ثم تحقق.' },
      'page.q1':         { en: 'What is the plural of كتاب (book)?',
                            fr: 'Quel est le pluriel de كتاب (livre) ?',
                            ar: 'ما جمع كلمة كتاب؟' },
      'page.q1.a':       { en: 'كتب (books)',      fr: 'كتب (livres)',       ar: 'كتب' },
      'page.q1.b':       { en: 'كاتب (writer)',    fr: 'كاتب (écrivain)',    ar: 'كاتب' },
      'page.q1.c':       { en: 'مكتب (desk)',      fr: 'مكتب (bureau)',      ar: 'مكتب' },
      'page.q2':         { en: 'What is the first letter of the Arabic alphabet?',
                            fr: 'Quelle est la première lettre de l\u2019alphabet arabe ?',
                            ar: 'ما أول حرف في الأبجدية العربية؟' },
      'page.q2.a':       { en: 'ب (ba)',           fr: 'ب (ba)',             ar: 'ب' },
      'page.q2.b':       { en: 'ا (alif)',         fr: 'ا (alif)',           ar: 'ا' },
      'page.q2.c':       { en: 'م (meem)',         fr: 'م (mîm)',            ar: 'م' },
      'page.check':      { en: 'Check answers',    fr: 'Vérifier',           ar: 'تحقق' },
      'page.correct':    { en: 'Correct',          fr: 'Correct',            ar: 'صحيح' },
      'page.incorrect':  { en: 'Try again',        fr: 'Réessayez',          ar: 'حاول مجدداً' },
      'page.progress':   { en: 'Progress',         fr: 'Progression',        ar: 'التقدم' },
      'page.completed':  { en: 'Completed',        fr: 'Terminé',            ar: 'مكتمل' },
      'page.notStarted': { en: 'Not started',      fr: 'Pas commencé',       ar: 'لم يبدأ' }
    };
  </script>
</head>
<body>
  <div data-include="/arabic/header.html"></div>
  <div data-include="/arabic/year7/module1/header.html"></div>
  <main>
    <h1 data-i18n="page.title">Lesson 2 — Practice</h1>
    <p  data-i18n="page.intro">Answer both questions, then check.</p>
    <section class="exercise">
      <div class="q-block" data-qid="q1">
        <h3 data-i18n="page.q1">What is the plural of كتاب (book)?</h3>
        <div class="q-options">
          <label><input type="radio" name="q1" value="a"> <span data-i18n="page.q1.a">كتب</span></label>
          <label><input type="radio" name="q1" value="b"> <span data-i18n="page.q1.b">كاتب</span></label>
          <label><input type="radio" name="q1" value="c"> <span data-i18n="page.q1.c">مكتب</span></label>
        </div>
        <p class="q-feedback" data-feedback aria-live="polite"></p>
      </div>
      <div class="q-block" data-qid="q2">
        <h3 data-i18n="page.q2">What is the first letter of the Arabic alphabet?</h3>
        <div class="q-options">
          <label><input type="radio" name="q2" value="a"> <span data-i18n="page.q2.a">ب</span></label>
          <label><input type="radio" name="q2" value="b"> <span data-i18n="page.q2.b">ا</span></label>
          <label><input type="radio" name="q2" value="c"> <span data-i18n="page.q2.c">م</span></label>
        </div>
        <p class="q-feedback" data-feedback aria-live="polite"></p>
      </div>
      <button id="check" class="btn" type="button" data-i18n="page.check">Check answers</button>
    </section>
    <p class="muted">
      <small>
        <span data-i18n="page.progress">Progress</span>:
        <span id="status" aria-live="polite">—</span>
      </small>
    </p>
  </main>
  <div data-include="/arabic/year7/module1/footer.html"></div>
  <div data-include="/arabic/footer.html"></div>
  <script src="/shared/include.js"></script>
  <script src="/register-sw.js" defer></script>
  <script type="module">
    import { initHeader } from '/shared/ui.js';
    import { initInstallButton } from '/shared/install.js';
    import { applyI18n } from '/shared/i18n.js';
    import { markLesson, getProgress } from '/arabic/assets/js/app.js';
    initHeader();
    initInstallButton();
    const MODULE = 'year7/module1';
    const LESSON = 'lesson2';
    const ANSWERS = { q1: 'a', q2: 'b' };
    const checkBtn = document.getElementById('check');
    checkBtn.addEventListener('click', async () => {
      let allCorrect = true;
      for (const [qid, answer] of Object.entries(ANSWERS)) {
        const block = document.querySelector(`[data-qid="${qid}"]`);
        const feedback = block.querySelector('[data-feedback]');
        const chosen = block.querySelector(`input[name="${qid}"]:checked`);
        if (chosen && chosen.value === answer) {
          feedback.dataset.state = 'ok';
          feedback.dataset.i18n = 'page.correct';
          applyI18n(feedback);
        } else {
          allCorrect = false;
          feedback.dataset.state = 'ko';
          feedback.dataset.i18n = 'page.incorrect';
          applyI18n(feedback);
        }
      }
      if (allCorrect) {
        await markLesson(MODULE, LESSON, true);
        await renderStatus();
      }
    });
    async function renderStatus() {
      const p = await getProgress(MODULE);
      const done = !!(p.lessons && p.lessons[LESSON]);
      const el = document.getElementById('status');
      if (!el) return;
      el.dataset.i18n = done ? 'page.completed' : 'page.notStarted';
      applyI18n(el);
      el.style.color = done ? 'var(--brand)' : 'var(--muted)';
    }
    renderStatus();
  </script>
</body>
</html>
