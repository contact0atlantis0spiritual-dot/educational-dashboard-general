<body>
  <div data-include="/philo/header.html"></div>
  <div data-include="/philo/term1/header.html"></div>
  <main>
    <h1 data-i18n="page.title">Leçon 1 — Qu'est-ce que la philosophie ?</h1>
    <div class="prompt">
      <p data-i18n="page.prompt">Socrate disait que la vie sans examen ne vaut pas la peine d'être vécue. Qu'est-ce que cela signifie, selon vous ?</p>
    </div>
    <textarea id="reflect" class="reflect"
              data-i18n-attr="placeholder:page.placeholder"
              placeholder="Écrivez votre réflexion ici…"></textarea>
    <p id="save-state" class="save-state" aria-live="polite"></p>
    <div class="btn-row">
      <button id="complete" class="btn" type="button" data-i18n="page.markComplete">Marquer comme fait</button>
    </div>
    <p class="muted">
      <small>
        <span data-i18n="page.progress">Progression</span>:
        <span id="status" aria-live="polite">—</span>
      </small>
    </p>
  </main>
  <div data-include="/philo/term1/footer.html"></div>
  <div data-include="/philo/footer.html"></div>
  <script src="/shared/include.js"></script>
  <script src="/register-sw.js" defer></script>
  <script type="module">
    import { initHeader } from '/shared/ui.js';
    import { initInstallButton } from '/shared/install.js';
    import { applyI18n } from '/shared/i18n.js';
    import { attachAutosave } from '/philo/term1/writing.js';
    import { getDraft, setDraft, markLesson, getProgress } from '/philo/assets/js/app.js';
    initHeader();
    initInstallButton();
    const MODULE = 'term1';
    const LESSON = 'lesson1';
    const ta  = document.getElementById('reflect');
    const out = document.getElementById('save-state');
    // Load saved draft BEFORE attaching autosave so `lastSaved` starts correct.
    (async () => {
      const draft = await getDraft(MODULE, LESSON);
      if (draft) ta.value = draft;
      attachAutosave(ta, {
        delay: 600,
        onSave: (value) => setDraft(MODULE, LESSON, value),
        onState: (s) => {
          if (s === 'saving')      { out.dataset.state = 'saving'; out.dataset.i18n = 'page.saving'; }
          else if (s === 'saved')  { out.dataset.state = 'saved';  out.dataset.i18n = 'page.saved';  }
          else                     { out.dataset.state = '';       out.dataset.i18n = '';            }
          applyI18n(out);
        }
      });
    })();
    document.getElementById('complete').addEventListener('click', async () => {
      // Flush a final save so "mark complete" never leaves the textarea unsaved.
      await setDraft(MODULE, LESSON, ta.value);
      await markLesson(MODULE, LESSON, true);
      await renderStatus();
    });
    async function renderStatus() {
      const p = await getProgress(MODULE);
      const done = !!(p.lessons && p.lessons[LESSON]);
      const el = document.getElementById('status');
      if (!el) return;
      el.dataset.i18n = done ? 'page.completed' : 'page.notStarted';
      applyI18n(el);
      el.style.color = done ? 'var(--brand)' : 'var(--muted)';
    }
    renderStatus();
  </script>
</body>
